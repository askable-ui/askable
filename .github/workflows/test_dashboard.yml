name: test / dashboard

on:
  push:
    branches: [main]
    paths:
      - "examples/analytics-dashboard-react/**"
      - ".github/workflows/test_dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/analytics-dashboard-react/**"
      - ".github/workflows/test_dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/analytics-dashboard-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/analytics-dashboard-react/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Validate pnpm lockfile and dependencies
        run: |
          npx --yes pnpm@10 install --lockfile-only --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10 audit --audit-level=high
