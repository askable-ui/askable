name: test / Expo

on:
  push:
    branches: [main]
    paths:
      - "examples/react-native-expo/**"
      - ".github/workflows/test_expo.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/react-native-expo/**"
      - ".github/workflows/test_expo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
    defaults:
      run:
        working-directory: examples/react-native-expo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/react-native-expo/package-lock.json
      - name: Clean install with strict peer validation
        run: npm ci --strict-peer-deps
      - name: Audit all dependencies
        run: npm audit --audit-level=low
      - name: Check dependency tree
        run: npm ls --all
      - name: Check Expo dependency alignment
        run: npx expo install --check
      - name: Check Expo project health
        run: npx --yes expo-doctor@1.20.4 --verbose
      - name: Test dependency override compatibility
        run: npm run test:dependencies
      - name: Typecheck
        run: npm run typecheck
      - name: Export Android, iOS, and web JavaScript
        run: npx expo export --platform all --output-dir dist/export --max-workers 2
